[package]
name = "kira-pairs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "High-performance, memory-bounded implementation of the core pairtools Hi-C .pairs workflow"
repository = "https://github.com/ARyaskov/kira-pairs"
keywords = ["hi-c", "genomics", "pairs", "pairtools", "bioinformatics"]
categories = ["science", "science::bioinformatics", "command-line-utilities"]
readme = "README.md"
default-run = "kira-pairs"

[lib]
name = "kira_pairs"
path = "src/lib.rs"

[[bin]]
name = "kira-pairs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
crossbeam-channel = "0.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
log = { version = "0.4", features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode"] }
memchr = "2.8"
noodles-bam = "0.95"
noodles-bgzf = "0.51"
noodles-core = "0.19"
noodles-sam = "0.90"
rayon = "1.12"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11"

[features]
default = []
# Optional native libdeflate backend for BGZF/gzip blocks (faster, needs a C toolchain).
libdeflate = ["dep:libdeflater"]

[dependencies.libdeflater]
version = "1.26"
optional = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "dedup"
harness = false

[[bench]]
name = "pipeline"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
